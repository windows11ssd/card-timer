<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مؤقت أدوار ألعاب الورق | Card Game Turn Timer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Cairo for Arabic, Inter for English/Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0B111E',
                        panelDark: '#131C2E',
                        cardDark: '#1A263D',
                        emeraldAccent: '#10B981',
                        emeraldHover: '#059669',
                        dangerRed: '#EF4444',
                        dangerHover: '#DC2626',
                        flashOrange: '#F59E0B'
                    },
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                        mono: ['Inter', 'monospace']
                    },
                    animation: {
                        'pulse-danger': 'pulseDanger 1s infinite alternate',
                        'flash-amber': 'flashAmber 0.35s ease-in-out'
                    },
                    keyframes: {
                        pulseDanger: {
                            '0%': { boxShadow: '0 0 15px rgba(239, 68, 68, 0.4)', transform: 'scale(1)' },
                            '100%': { boxShadow: '0 0 45px rgba(239, 68, 68, 0.8)', transform: 'scale(1.02)' }
                        },
                        flashAmber: {
                            '0%': { backgroundColor: '#10B981', boxShadow: '0 0 0px transparent' },
                            '40%': { backgroundColor: '#F59E0B', boxShadow: '0 0 50px rgba(245, 158, 11, 0.95)', transform: 'scale(0.96)' },
                            '100%': { backgroundColor: '#10B981', boxShadow: '0 0 35px rgba(16, 185, 129, 0.35)', transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #0B111E;
            font-family: 'Cairo', sans-serif;
        }

        .timer-ring-circle {
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .glow-emerald {
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.35), inset 0 2px 10px rgba(255, 255, 255, 0.2);
        }
        .glow-danger {
            box-shadow: 0 0 45px rgba(239, 68, 68, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.2);
        }
        .glow-amber {
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.85), inset 0 2px 10px rgba(255, 255, 255, 0.3);
        }
        
        .flash-active {
            animation: flashAmber 0.35s ease-in-out !important;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>

<body class="bg-bgDark text-slate-100 flex flex-col justify-between items-center h-full w-full font-sans overflow-y-auto px-4 py-3 sm:py-6">

    <header class="w-full max-w-lg flex items-center justify-between gap-2 z-20 shrink-0">
        <div class="flex items-center gap-2">
            <button id="openSettingsBtn" aria-label="Settings" class="p-2.5 rounded-xl bg-panelDark border border-slate-700/60 hover:bg-slate-800 active:scale-95 text-slate-300 hover:text-white transition shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>

            <button id="shareBtn" aria-label="Share" class="p-2.5 rounded-xl bg-panelDark border border-slate-700/60 hover:bg-slate-800 active:scale-95 text-slate-300 hover:text-white transition shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                </svg>
            </button>

            <button id="installAppBtn" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-panelDark border border-slate-700/60 text-xs font-semibold text-emeraldAccent hover:text-white hover:bg-slate-800 active:scale-95 transition shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span data-i18n="installApp">تثبيت التطبيق</span>
            </button>
        </div>

        <div class="flex items-center gap-2">
            <button id="fullscreenBtn" aria-label="Toggle Fullscreen" class="p-2.5 rounded-xl bg-panelDark border border-slate-700/60 hover:bg-slate-800 active:scale-95 text-slate-300 hover:text-white transition shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
            </button>

            <button id="langToggleBtn" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-panelDark border border-slate-700/60 text-xs font-bold text-slate-200 hover:border-emeraldAccent/60 active:scale-95 transition shadow-sm">
                <span id="langLabel">English</span>
                <span class="text-base">🌐</span>
            </button>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center justify-center my-auto py-2">
        <div id="statusBadge" class="text-emeraldAccent font-bold text-base sm:text-lg tracking-wide mb-1 transition-all duration-300 h-7 flex items-center justify-center">
            <span data-i18n="statusPaused">موقوف مؤقتاً</span>
        </div>

        <div class="flex items-center gap-2 bg-panelDark border border-slate-800/80 px-4 py-1.5 rounded-full mb-4 shadow-inner">
            <span class="text-xs sm:text-sm text-slate-300 font-medium" id="turnCounterLabel">
                <span data-i18n="currentTurn">الدور الحالي:</span> <strong id="turnNumber" class="text-white font-bold">#1</strong>
            </span>
            <button id="resetTurnCountBtn" aria-label="Reset turn count" class="p-1 hover:bg-slate-800 rounded-full text-slate-400 hover:text-emeraldAccent transition active:scale-90" title="إعادة ضبط عداد الأدوار">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>

        <!-- Central Timer Ring -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
            <svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-md" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke="#131C2E" stroke-width="4.5" fill="none" />
                <circle id="timerProgressRing" cx="50" cy="50" r="45" 
                        stroke="#10B981" 
                        stroke-width="5" 
                        stroke-dasharray="282.74" 
                        stroke-dashoffset="0" 
                        stroke-linecap="round"
                        class="timer-ring-circle" 
                        fill="none" />
            </svg>

            <button id="mainTimerBtn" 
                    class="w-52 h-52 sm:w-60 sm:h-60 rounded-full bg-emeraldAccent hover:bg-emeraldHover glow-emerald active:scale-95 transition-all duration-200 flex flex-col items-center justify-center cursor-pointer outline-none border-4 border-emerald-400/30 z-10 select-none">
                <div id="timerDisplay" class="text-5xl sm:text-6xl font-extrabold tracking-tight text-white font-mono drop-shadow-md">
                    00:15
                </div>
                <div id="btnSubtitle" class="text-xs sm:text-sm font-bold text-emerald-100/90 mt-2 tracking-wide px-4 text-center">
                    <span data-i18n="tapToStart">اضغط للبدء</span>
                </div>
            </button>
        </div>

        <div class="w-full mt-5 px-2">
            <button id="pauseResumeBtn" class="w-full bg-panelDark border-2 border-slate-700 hover:border-emeraldAccent/80 text-white font-extrabold py-4 px-6 rounded-2xl text-base sm:text-lg flex items-center justify-center gap-3 shadow-lg hover:bg-slate-800/80 active:scale-98 transition">
                <svg id="pausePlayIcon" class="w-6 h-6 text-emeraldAccent" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span id="pauseResumeText" data-i18n="btnResume">استئناف</span>
            </button>
        </div>

        <div class="w-full grid grid-cols-4 gap-2.5 mt-4 px-2">
            <button class="preset-btn bg-panelDark border border-slate-800 text-slate-300 font-bold py-2.5 px-2 rounded-xl text-sm hover:bg-slate-800 transition active:scale-95" data-seconds="10">
                10 <span data-i18n="secShort">ث</span>
            </button>
            <button class="preset-btn bg-panelDark border-2 border-emeraldAccent text-emeraldAccent font-bold py-2.5 px-2 rounded-xl text-sm shadow-sm transition active:scale-95" data-seconds="15">
                15 <span data-i18n="secShort">ث</span>
            </button>
            <button class="preset-btn bg-panelDark border border-slate-800 text-slate-300 font-bold py-2.5 px-2 rounded-xl text-sm hover:bg-slate-800 transition active:scale-95" data-seconds="30">
                30 <span data-i18n="secShort">ث</span>
            </button>
            <button class="preset-btn bg-panelDark border border-slate-800 text-slate-300 font-bold py-2.5 px-2 rounded-xl text-sm hover:bg-slate-800 transition active:scale-95" data-seconds="60">
                60 <span data-i18n="secShort">ث</span>
            </button>
        </div>

        <div class="w-full mt-3 px-2">
            <button id="resetTimerBtn" class="w-full flex items-center justify-center gap-2 bg-panelDark/70 border border-slate-800 hover:bg-slate-800 text-slate-300 font-bold py-3 px-4 rounded-xl text-sm active:scale-95 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span data-i18n="btnReset">إعادة ضبط</span>
            </button>
        </div>
    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-panelDark border border-slate-700/80 w-full max-w-sm rounded-2xl p-5 shadow-2xl transform scale-95 transition-transform duration-200">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
                <div class="flex items-center gap-2 text-emeraldAccent font-bold text-lg">
                    <span data-i18n="settingsTitle">إعدادات المؤقت</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                    </svg>
                </div>
            </div>

            <div class="py-5 space-y-5">
                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-slate-300 text-start" data-i18n="turnTimeLabel">
                        وقت الدور (بالثواني):
                    </label>
                    <div class="relative flex items-center">
                        <input id="customTimeInput" type="number" min="1" max="999" value="15" 
                               class="w-full bg-bgDark border border-slate-700 rounded-xl py-3 px-4 text-center font-extrabold text-lg text-white focus:outline-none focus:border-emeraldAccent transition">
                        <span class="absolute left-4 rtl:left-auto rtl:right-4 text-slate-400 text-sm font-medium" data-i18n="secFull">ثانية</span>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <span class="text-sm font-bold text-slate-200" data-i18n="soundAlerts">الصوت والتنبيهات</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input id="soundToggle" type="checkbox" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emeraldAccent"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-slate-200" data-i18n="vibrationAlerts">الاهتزاز (الهواتف)</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input id="vibrationToggle" type="checkbox" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emeraldAccent"></div>
                    </label>
                </div>
            </div>

            <button id="saveSettingsBtn" class="w-full bg-emeraldAccent hover:bg-emeraldHover text-slate-950 font-extrabold py-3.5 rounded-xl transition active:scale-95 text-center shadow-lg" data-i18n="saveAndClose">
                حفظ وإغلاق
            </button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-2 pointer-events-none opacity-0 transition-opacity duration-300 z-50">
        <span id="toastMsg"></span>
    </div>

    <div id="installModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-panelDark border border-slate-700/80 w-full max-w-sm rounded-2xl p-5 shadow-2xl transform scale-95 transition-transform duration-200 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <span class="text-emeraldAccent font-bold text-lg" data-i18n="installTitle">تثبيت التطبيق</span>
                <button id="closeInstallModalBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <p class="text-sm text-slate-300 leading-relaxed" id="installModalText">
                لتثبيت التطبيق على هاتفك: اضغط على زر المشاركة في متصفحك ثم اختر "إضافة إلى الشاشة الرئيسية"
            </p>
            <button id="dismissInstallModalBtn" class="w-full bg-emeraldAccent hover:bg-emeraldHover text-slate-950 font-extrabold py-3 rounded-xl transition active:scale-95 text-center shadow-lg" data-i18n="gotIt">
                حسناً، فهمت
            </button>
        </div>
    </div>

    <script>
        const i18n = {
            ar: {
                installApp: "تثبيت التطبيق",
                installTitle: "تثبيت التطبيق",
                gotIt: "حسناً، فهمت",
                installInstruction: "لتثبيت التطبيق على هاتفك: اضغط على زر المشاركة في متصفحك ثم اختر \"إضافة إلى الشاشة الرئيسية\" (Add to Home Screen).",
                statusPaused: "موقوف مؤقتاً",
                currentTurn: "الدور الحالي:",
                statusFinished: "انتهى الوقت!",
                statusRunning: "جاري العد...",
                tapToPass: "اضغط لتمرير الدور",
                tapToStart: "اضغط للبدء",
                timeFinishedBtn: "انتهى الوقت - اضغط للدور التالي",
                btnPause: "إيقاف مؤقت",
                btnResume: "استئناف",
                secShort: "ث",
                secFull: "ثانية",
                btnReset: "إعادة ضبط",
                settingsTitle: "إعدادات المؤقت",
                turnTimeLabel: "وقت الدور (بالثواني):",
                soundAlerts: "الصوت والتنبيهات",
                vibrationAlerts: "الاهتزاز (الهواتف)",
                saveAndClose: "حفظ وإغلاق",
                shareTitle: "مؤقت أدوار ألعاب الورق",
                shareText: "استخدم هذا المؤقت الذكي لألعاب الورق والطاولة!",
                copiedMsg: "تم نسخ الرابط للحافظة!"
            },
            en: {
                installApp: "Install App",
                installTitle: "Install App",
                gotIt: "Got It",
                installInstruction: "To install on your phone: Tap the share button in your browser and select \"Add to Home Screen\".",
                statusPaused: "Paused",
                currentTurn: "Current Turn:",
                statusFinished: "Time's Up!",
                statusRunning: "Counting Down...",
                tapToPass: "Tap to pass turn",
                tapToStart: "Tap to start",
                timeFinishedBtn: "Time's Up! Tap for next turn",
                btnPause: "Pause",
                btnResume: "Resume",
                secShort: "s",
                secFull: "sec",
                btnReset: "Reset Timer",
                settingsTitle: "Timer Settings",
                turnTimeLabel: "Turn Duration (Seconds):",
                soundAlerts: "Sound Alerts",
                vibrationAlerts: "Vibration (Mobiles)",
                saveAndClose: "Save & Close",
                shareTitle: "Card Game Turn Timer",
                shareText: "Check out this smart card game turn timer!",
                copiedMsg: "Link copied to clipboard!"
            }
        };

        let currentLang = 'ar';
        let totalTimeSeconds = 15;
        let timeRemainingSeconds = 15;
        let turnCounter = 1;
        let timerInterval = null;
        let isRunning = false;
        let isPaused = true;
        let isFinished = false;
        let soundEnabled = true;
        let vibrationEnabled = true;
        let isFlashingOrange = false;
        let flashTimeout = null;
        let deferredPrompt = null;
        let audioCtx = null;

        // DOM elements
        const htmlElem = document.documentElement;
        const mainTimerBtn = document.getElementById('mainTimerBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const btnSubtitle = document.getElementById('btnSubtitle');
        const statusBadge = document.getElementById('statusBadge');
        const timerProgressRing = document.getElementById('timerProgressRing');
        const turnNumber = document.getElementById('turnNumber');
        const resetTurnCountBtn = document.getElementById('resetTurnCountBtn');
        const pauseResumeBtn = document.getElementById('pauseResumeBtn');
        const pauseResumeText = document.getElementById('pauseResumeText');
        const pausePlayIcon = document.getElementById('pausePlayIcon');
        const resetTimerBtn = document.getElementById('resetTimerBtn');
        const langToggleBtn = document.getElementById('langToggleBtn');
        const langLabel = document.getElementById('langLabel');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const customTimeInput = document.getElementById('customTimeInput');
        const soundToggle = document.getElementById('soundToggle');
        const vibrationToggle = document.getElementById('vibrationToggle');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const shareBtn = document.getElementById('shareBtn');
        const installAppBtn = document.getElementById('installAppBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const installModal = document.getElementById('installModal');
        const closeInstallModalBtn = document.getElementById('closeInstallModalBtn');
        const dismissInstallModalBtn = document.getElementById('dismissInstallModalBtn');
        const installModalText = document.getElementById('installModalText');

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'pass') {
                // Crisp 8-bit digital pass beep
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'square';
                osc1.frequency.setValueAtTime(1800, now);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.05);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(2400, now + 0.05);
                gain2.gain.setValueAtTime(0.25, now + 0.05);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.05);
                osc2.stop(now + 0.11);
            } else if (type === 'loss') {
                // Digital timeout error signal
                const frequencies = [1050, 820, 600];
                frequencies.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = now + (idx * 0.08);

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.07);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.07);
                });

                // Low digital buzzer finish
                const buzzOsc = audioCtx.createOscillator();
                const buzzGain = audioCtx.createGain();
                const buzzStart = now + 0.25;

                buzzOsc.type = 'sawtooth';
                buzzOsc.frequency.setValueAtTime(180, buzzStart);
                buzzOsc.frequency.linearRampToValueAtTime(120, buzzStart + 0.35);

                buzzGain.gain.setValueAtTime(0.3, buzzStart);
                buzzGain.gain.exponentialRampToValueAtTime(0.001, buzzStart + 0.35);

                buzzOsc.connect(buzzGain);
                buzzGain.connect(audioCtx.destination);
                buzzOsc.start(buzzStart);
                buzzOsc.stop(buzzStart + 0.35);
            }
        }

        function triggerHaptic(duration = 40) {
            if (vibrationEnabled && navigator.vibrate) {
                try {
                    navigator.vibrate(duration);
                } catch (e) {}
            }
        }

        function triggerFlashAnimation() {
            isFlashingOrange = true;
            if (flashTimeout) clearTimeout(flashTimeout);
            
            mainTimerBtn.classList.add('flash-active');
            
            flashTimeout = setTimeout(() => {
                isFlashingOrange = false;
                mainTimerBtn.classList.remove('flash-active');
                render();
            }, 350);
            
            render();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isRunning = true;
            isPaused = false;
            isFinished = false;

            timerInterval = setInterval(() => {
                if (!isPaused && timeRemainingSeconds > 0) {
                    timeRemainingSeconds--;
                    render();

                    if (timeRemainingSeconds === 0) {
                        onTimerFinished();
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            isPaused = true;
            render();
        }

        function togglePause() {
            initAudio();
            if (isFinished) {
                nextTurn();
                return;
            }

            if (!isRunning) {
                startTimer();
            } else {
                isPaused = !isPaused;
            }
            triggerHaptic(30);
            render();
        }

        function resetTimer() {
            initAudio();
            if (timerInterval) clearInterval(timerInterval);
            timeRemainingSeconds = totalTimeSeconds;
            isRunning = false;
            isPaused = true;
            isFinished = false;
            triggerHaptic(20);
            render();
        }

        function nextTurn() {
            initAudio();
            if (isRunning && !isPaused && !isFinished) {
                turnCounter++;
                triggerFlashAnimation();
            } else if (isFinished) {
                turnCounter++;
                isFinished = false;
            }

            timeRemainingSeconds = totalTimeSeconds;
            playBeep('pass');
            triggerHaptic(40);
            startTimer();
            render();
        }

        function onTimerFinished() {
            if (timerInterval) clearInterval(timerInterval);
            isFinished = true;
            isRunning = false;
            isPaused = true;
            playBeep('loss');
            triggerHaptic([100, 50, 100, 50, 200]);
            render();
        }

        function setDuration(secs) {
            const parsed = parseInt(secs, 10);
            if (!isNaN(parsed) && parsed > 0) {
                totalTimeSeconds = parsed;
                timeRemainingSeconds = totalTimeSeconds;
                customTimeInput.value = totalTimeSeconds;
                saveSettingsToStorage();
                resetTimer();
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function render() {
            timerDisplay.textContent = formatTime(timeRemainingSeconds);
            turnNumber.textContent = `#${turnCounter}`;

            const ringCircumference = 282.74;
            const progressRatio = timeRemainingSeconds / totalTimeSeconds;
            const strokeOffset = ringCircumference * (1 - progressRatio);
            timerProgressRing.style.strokeDashoffset = strokeOffset;

            // Render status badge and button colors
            if (isFinished) {
                statusBadge.textContent = i18n[currentLang].statusFinished;
                statusBadge.className = "text-dangerRed font-bold text-base sm:text-lg tracking-wide mb-1 transition-all duration-300 h-7 flex items-center justify-center animate-bounce";
                
                mainTimerBtn.className = "w-52 h-52 sm:w-60 sm:h-60 rounded-full bg-dangerRed hover:bg-dangerHover glow-danger active:scale-95 transition-all duration-200 flex flex-col items-center justify-center cursor-pointer outline-none border-4 border-red-400/30 z-10 select-none animate-pulse-danger";
                timerProgressRing.setAttribute('stroke', '#EF4444');
                btnSubtitle.innerHTML = `<span data-i18n="timeFinishedBtn">${i18n[currentLang].timeFinishedBtn}</span>`;
            } else if (isFlashingOrange) {
                statusBadge.textContent = i18n[currentLang].statusRunning;
                statusBadge.className = "text-flashOrange font-bold text-base sm:text-lg tracking-wide mb-1 transition-all duration-300 h-7 flex items-center justify-center";

                mainTimerBtn.className = "w-52 h-52 sm:w-60 sm:h-60 rounded-full bg-flashOrange glow-amber active:scale-95 transition-all duration-200 flex flex-col items-center justify-center cursor-pointer outline-none border-4 border-amber-300/40 z-10 select-none";
                timerProgressRing.setAttribute('stroke', '#F59E0B');
                btnSubtitle.innerHTML = `<span data-i18n="tapToPass">${i18n[currentLang].tapToPass}</span>`;
            } else if (!isRunning || isPaused) {
                statusBadge.textContent = i18n[currentLang].statusPaused;
                statusBadge.className = "text-emeraldAccent font-bold text-base sm:text-lg tracking-wide mb-1 transition-all duration-300 h-7 flex items-center justify-center";

                mainTimerBtn.className = "w-52 h-52 sm:w-60 sm:h-60 rounded-full bg-emeraldAccent hover:bg-emeraldHover glow-emerald active:scale-95 transition-all duration-200 flex flex-col items-center justify-center cursor-pointer outline-none border-4 border-emerald-400/30 z-10 select-none";
                timerProgressRing.setAttribute('stroke', '#10B981');
                btnSubtitle.innerHTML = `<span data-i18n="${isRunning ? 'tapToPass' : 'tapToStart'}">${isRunning ? i18n[currentLang].tapToPass : i18n[currentLang].tapToStart}</span>`;
            } else {
                statusBadge.textContent = i18n[currentLang].statusRunning;
                statusBadge.className = "text-emeraldAccent font-bold text-base sm:text-lg tracking-wide mb-1 transition-all duration-300 h-7 flex items-center justify-center";

                mainTimerBtn.className = "w-52 h-52 sm:w-60 sm:h-60 rounded-full bg-emeraldAccent hover:bg-emeraldHover glow-emerald active:scale-95 transition-all duration-200 flex flex-col items-center justify-center cursor-pointer outline-none border-4 border-emerald-400/30 z-10 select-none";
                timerProgressRing.setAttribute('stroke', '#10B981');
                btnSubtitle.innerHTML = `<span data-i18n="tapToPass">${i18n[currentLang].tapToPass}</span>`;
            }

            // Update Pause/Resume control button state
            if (!isRunning || isPaused || isFinished) {
                pausePauseText = i18n[currentLang].btnResume;
                pausePlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
            } else {
                pausePauseText = i18n[currentLang].btnPause;
                pausePlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
            }
            pauseResumeText.textContent = pausePauseText;

            // Highlight active preset button
            presetBtns.forEach(btn => {
                const secs = parseInt(btn.dataset.seconds, 10);
                if (secs === totalTimeSeconds) {
                    btn.className = "preset-btn bg-panelDark border-2 border-emeraldAccent text-emeraldAccent font-bold py-2.5 px-2 rounded-xl text-sm shadow-sm transition active:scale-95";
                } else {
                    btn.className = "preset-btn bg-panelDark border border-slate-800 text-slate-300 font-bold py-2.5 px-2 rounded-xl text-sm hover:bg-slate-800 transition active:scale-95";
                }
            });
        }

        function updateLocalization() {
            htmlElem.lang = currentLang;
            htmlElem.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            langLabel.textContent = currentLang === 'ar' ? 'English' : 'عربي';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.textContent = i18n[currentLang][key];
                }
            });
        }

        function saveSettingsToStorage() {
            try {
                const data = {
                    totalTimeSeconds,
                    soundEnabled,
                    vibrationEnabled,
                    currentLang
                };
                localStorage.setItem('card_game_timer_settings', JSON.stringify(data));
            } catch (e) {}
        }

        function loadSettingsFromStorage() {
            try {
                const stored = localStorage.getItem('card_game_timer_settings');
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.totalTimeSeconds) totalTimeSeconds = data.totalTimeSeconds;
                    if (typeof data.soundEnabled === 'boolean') soundEnabled = data.soundEnabled;
                    if (typeof data.vibrationEnabled === 'boolean') vibrationEnabled = data.vibrationEnabled;
                    if (data.currentLang) currentLang = data.currentLang;

                    timeRemainingSeconds = totalTimeSeconds;
                    customTimeInput.value = totalTimeSeconds;
                    soundToggle.checked = soundEnabled;
                    vibrationToggle.checked = vibrationEnabled;
                }
            } catch (e) {}
        }

        function openModal() {
            customTimeInput.value = totalTimeSeconds;
            soundToggle.checked = soundEnabled;
            vibrationToggle.checked = vibrationEnabled;
            settingsModal.classList.remove('hidden');
            setTimeout(() => {
                settingsModal.classList.remove('opacity-0');
                settingsModal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            settingsModal.classList.add('opacity-0');
            settingsModal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
            }, 200);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (!toast || !toastMsg) return;
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function openInstallModal() {
            installModalText.textContent = i18n[currentLang].installInstruction;
            installModal.classList.remove('hidden');
            setTimeout(() => {
                installModal.classList.remove('opacity-0');
                installModal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeInstallModal() {
            installModal.classList.add('opacity-0');
            installModal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                installModal.classList.add('hidden');
            }, 200);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        mainTimerBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            nextTurn();
        });

        pauseResumeBtn.addEventListener('click', togglePause);
        resetTimerBtn.addEventListener('click', resetTimer);

        resetTurnCountBtn.addEventListener('click', () => {
            turnCounter = 1;
            triggerHaptic(30);
            render();
        });

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const secs = parseInt(btn.dataset.seconds, 10);
                setDuration(secs);
            });
        });

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            saveSettingsToStorage();
            updateLocalization();
            render();
        });

        openSettingsBtn.addEventListener('click', openModal);
        closeSettingsBtn.addEventListener('click', closeModal);
        saveSettingsBtn.addEventListener('click', () => {
            soundEnabled = soundToggle.checked;
            vibrationEnabled = vibrationToggle.checked;
            setDuration(customTimeInput.value);
            saveSettingsToStorage();
            closeModal();
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeModal();
        });

        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: i18n[currentLang].shareTitle,
                text: i18n[currentLang].shareText,
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {}
            } else {
                let success = false;
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    success = true;
                } catch (err) {
                    const tempInput = document.createElement('input');
                    tempInput.value = window.location.href;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    success = document.execCommand('copy');
                    document.body.removeChild(tempInput);
                }
                if (success) {
                    showToast(i18n[currentLang].copiedMsg);
                }
            }
        });

        installAppBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    deferredPrompt = null;
                }
            } else {
                openInstallModal();
            }
        });

        if (closeInstallModalBtn) closeInstallModalBtn.addEventListener('click', closeInstallModal);
        if (dismissInstallModalBtn) dismissInstallModalBtn.addEventListener('click', closeInstallModal);
        if (installModal) {
            installModal.addEventListener('click', (e) => {
                if (e.target === installModal) closeInstallModal();
            });
        }

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadSettingsFromStorage();
            updateLocalization();
            render();
        });
    </script>
</body>
</html>
